name: Deploy Laravel to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && test -f artisan && test -f .env && command -v composer && command -v rsync && php -v"

      - name: Deploy files
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p $SSH_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='public/uploads/' \
            --exclude='config/googleCredentials.json' \
            ./ "$SSH_USERNAME@$SSH_HOST:$DEPLOY_PATH/"

      - name: Install Composer dependencies
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction"

      - name: Optimize Laravel
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && php artisan optimize:clear && php artisan config:cache && php artisan view:cache"

      - name: Deployment completed
        run: echo "Laravel deployment completed successfully!"
